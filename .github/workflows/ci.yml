name: CI

on:
  push:
    branches: [master, "v*.*.*"]
  pull_request:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit message matches version.rb
        run: |
          VERSION=$(ruby -e "load 'lib/docscribe/version.rb'; puts Docscribe::VERSION")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SUBJECT=$(git show -s --pretty=%s "${{ github.event.pull_request.head.sha }}")
          else
            SUBJECT=$(git log -1 --pretty=%s)
          fi
          echo "version.rb: $VERSION"
          echo "commit: $SUBJECT"
          if ! echo "$SUBJECT" | grep -Eq "^\[$VERSION\] "; then
            echo "::error::Commit subject does not match [$VERSION] — got: $SUBJECT"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ 2.7, 3.0, 3.1, 3.2, 3.3, 3.4, 4.0 ]
    env:
      BUNDLE_GEMFILE: ${{ matrix.ruby == '2.7' && 'Gemfile_2_7' || 'Gemfile' }}
      BUNDLE_WITHOUT: ${{ contains(fromJson('["3.0", "3.1"]'), matrix.ruby) && 'rbs' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Docscribe (check docs are up-to-date)
        # RBS is unavailable on these rubies, so fallback inference can never
        # match the RBS-precise docs — same reason Steep is skipped below.
        # NOTE: the check itself must run from the repo root: docscribe.yml
        # relative paths (sig_dirs, rbs_collection.lock.yaml) resolve against
        # the working directory, and test_project/ has no sig/.
        if: ${{ !contains(fromJson('["2.7", "3.0", "3.1"]'), matrix.ruby) }}
        run: |
          cd test_project && BUNDLE_GEMFILE=Gemfile bundle install && cd ..
          # .gem_rbs_collection/ is gitignored, so a fresh checkout has no
          # collection and RBS lookups silently fall back to inference
          # (dozens of false mismatches). Materialize it from the lock file.
          bundle exec rbs collection install
          FILES="$(git ls-files 'lib/**/*.rb')"
          bundle exec docscribe $FILES -C docscribe.yml

      - name: Docscribe (aggressive mode smoke test)
        env:
          BUNDLE_GEMFILE: ${{ matrix.ruby == '2.7' && 'Gemfile_2_7' || 'Gemfile' }}
        run: |
          bundle exec docscribe lib -AkB --verbose

      - name: Steep (type check)
        if: ${{ !contains(fromJson('["2.7", "3.0", "3.1"]'), matrix.ruby) }}
        run: bundle exec steep check

      - name: RuboCop (self‑check)
        run: bundle exec rubocop

      - name: RSpec
        run: bundle exec rspec
